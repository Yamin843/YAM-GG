name: Build YAM-GG (.so only)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: "26.1.10909125"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Reassemble libyamjs.a from parts
      run: |
        LIB_DIR=app/src/main/jni/all_libs/YAM-G/LIBYAMJS
        cd "$LIB_DIR"

        echo "=== parts available ==="
        ls -la libyamjs.a.part* 2>/dev/null || {
          echo "ERROR: no .part files found"
          exit 1
        }

        echo ""
        echo "=== concatenating ==="
        cat libyamjs.a.part* > libyamjs.a

        echo ""
        echo "=== result ==="
        ls -la libyamjs.a
        SIZE=$(stat -c%s libyamjs.a)
        echo "Size: $SIZE bytes"

        if [ "$SIZE" -lt 100000000 ]; then
          echo "ERROR: reassembled file too small"
          exit 1
        fi

        echo ""
        echo "=== cleanup parts ==="
        rm -f libyamjs.a.part*

        echo "OK"

    - name: Inspect preinstalled SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "(no $ANDROID_HOME)"
        echo ""
        echo "cmdline-tools:"
        ls $ANDROID_HOME/cmdline-tools/ 2>/dev/null || echo "(none)"
        echo ""
        echo "ndk preinstalled:"
        ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "(none)"
        echo ""
        echo "build-tools:"
        ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "(none)"
        echo ""
        echo "platforms:"
        ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "(none)"

    - name: Install NDK + Build Tools
      run: |
        set -e

        CMDPATH=""
        for v in 19.0 18.0 17.0 16.0 15.0 latest; do
            if [ -d "$ANDROID_HOME/cmdline-tools/$v/bin" ]; then
                CMDPATH="$ANDROID_HOME/cmdline-tools/$v/bin"
                break
            fi
        done

        if [ -z "$CMDPATH" ]; then
            echo "ERROR: cmdline-tools not found"
            find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null
            exit 1
        fi

        echo "Using cmdline-tools at: $CMDPATH"
        SDKMANAGER="$CMDPATH/sdkmanager"

        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

        "$SDKMANAGER" --install "ndk;$NDK_VERSION" 2>&1 | tail -3
        "$SDKMANAGER" --install "build-tools;34.0.0" 2>&1 | tail -3
        "$SDKMANAGER" --install "platforms;android-34" 2>&1 | tail -3

        echo ""
        echo "NDK:"
        ls -la $ANDROID_HOME/ndk/
        $ANDROID_HOME/ndk/$NDK_VERSION/ndk-build --version

    - name: Verify project layout
      run: |
        echo "=== jni ==="
        ls app/src/main/jni/
        echo ""
        echo "=== all_libs ==="
        ls app/src/main/jni/all_libs/
        echo ""
        echo "=== YAM-G/LIBYAMJS ==="
        ls -la app/src/main/jni/all_libs/YAM-G/LIBYAMJS/
        echo ""
        echo "=== imgui ==="
        ls app/src/main/jni/all_libs/imgui/ | head -10
        echo ""
        echo "=== java ==="
        ls app/src/main/java/com/yamgg/modview/
        echo ""
        echo "=== scripts ==="
        ls scripts/

    - name: Verify Dobby source
      run: |
        echo "=== Dobby dir ==="
        ls app/src/main/jni/all_libs/Dobby/
        echo ""
        echo "=== source/ ==="
        ls app/src/main/jni/all_libs/Dobby/source/ | head -10
        echo ""
        echo "=== source file count ==="
        find app/src/main/jni/all_libs/Dobby/source -name "*.cc" -o -name "*.c" | wc -l

    - name: Generate embedded dex
      run: |
        chmod +x scripts/generate-dex.sh scripts/dex_to_header.py
        bash scripts/generate-dex.sh
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Verify dex generation
      run: |
        ls -la app/src/main/jni/Generated/
        wc -l app/src/main/jni/Generated/embedded_dex.h
        head -15 app/src/main/jni/Generated/embedded_dex.h

    - name: Build .so with ndk-build
      run: |
        set -e
        cd app/src/main/jni
        $ANDROID_HOME/ndk/$NDK_VERSION/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=./Android.mk \
          NDK_APPLICATION_MK=./Application.mk \
          NDK_OUT=/tmp/ndk-out \
          NDK_LIBS_OUT=/tmp/ndk-libs \
          V=1 2>&1 | tee /tmp/ndk-build.log

    - name: Locate .so
      run: |
        SO=$(find /tmp -name "libYAMGG.so" -type f 2>/dev/null | head -1)
        if [ -z "$SO" ]; then
          echo "ERROR: libYAMGG.so not built"
          tail -150 /tmp/ndk-build.log
          exit 1
        fi
        echo "FOUND: $SO"
        du -h "$SO"
        file "$SO"
        echo "$SO" > /tmp/so_path.txt

    - name: Verify .so symbols
      continue-on-error: true
      run: |
        SO=$(cat /tmp/so_path.txt)
        NM=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm

        echo "=== SO info ==="
        file "$SO"
        du -h "$SO"

        echo ""
        echo "=== JNI_OnLoad ==="
        $NM -D "$SO" > /tmp/nm-dyn.txt 2>&1
        grep -i JNI_OnLoad /tmp/nm-dyn.txt || echo "MISSING"

        echo ""
        echo "=== Java_* exports (first 10) ==="
        grep " T Java_" /tmp/nm-dyn.txt | head -10 || echo "(none)"

        echo ""
        echo "=== undefined (first 20) ==="
        grep " U " /tmp/nm-dyn.txt | head -20 || echo "(none)"

        echo ""
        echo "=== .so is present at: $SO ==="

    - name: Copy .so to artifact
      run: |
        mkdir -p /tmp/artifact
        SO=$(cat /tmp/so_path.txt)
        cp "$SO" /tmp/artifact/libYAMGG.so
        ls -la /tmp/artifact/

    - name: Upload .so
      uses: actions/upload-artifact@v4
      with:
        name: YAMGG-so
        path: /tmp/artifact/libYAMGG.so
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: YAMGG-build-log
        path: /tmp/ndk-build.log
        if-no-files-found: warn
